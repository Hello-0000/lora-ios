name: LoRa
options:
  bundleIdPrefix: com.alexdtu
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  LoRa:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: WebAssets
        type: folder
    scheme:
      testTargets: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexdtu.loraapp.ios
        PRODUCT_NAME: LoRa
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        MARKETING_VERSION: "0.8.0"
        CURRENT_PROJECT_VERSION: "25"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: LoRa
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: 用于在局域网内发现并控制 LoRa 设备
        NFCReaderUsageDescription: 用于贴近终端读写设备信息
        NSCameraUsageDescription: 用于扫描设备二维码
        NSPhotoLibraryUsageDescription: 用于读取相册中的二维码图片
